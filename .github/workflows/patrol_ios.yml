name: Patrol iOS

on:
  workflow_dispatch:

jobs:
  patrol-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.example.basicModernApp
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --no-enable-swift-package-manager

      - run: flutter pub get

      - name: Add Patrol RunnerUITests target
        run: |
          gem install xcodeproj --no-document
          ruby ios/add_patrol_ui_tests.rb

      - run: |
          dart pub global activate patrol_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # ADDED: ffmpeg for trimming + compressing the recording
      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run Patrol test (with recording)
        timeout-minutes: 25
        run: |
          set -m
          mkdir -p test_videos
          RAW="$RUNNER_TEMP/patrol_raw.mp4"                  # ADDED: raw recording stays out of the artifact
          APP_START_FILE="$RUNNER_TEMP/app_start"            # ADDED
          rm -f "$RAW" "$APP_START_FILE"
          VIDEO="test_videos/patrol_ios_$(date +%Y%m%d_%H%M%S).mp4"

          # MODIFIED: start recording now (idle machine = fast start), trim to app launch later
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$RAW" &
          echo "[REC] Recording started"

          # MODIFIED: watcher only timestamps the first app launch
          (
            until xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "UIKitApplication:$BUNDLE_ID"; do
              sleep 0.5
            done
            date +%s > "$APP_START_FILE"
            echo "[REC] App launched"
          ) &
          WATCHER=$!

          set +e
          patrol test -t patrol_test/app_test.dart -d "$UDID" --verbose
          PATROL_EXIT=$?
          set -e
          STOP=$(date +%s)                                   # ADDED

          pkill -INT -f "recordVideo" || true
          for i in $(seq 1 20); do
            pgrep -f "recordVideo" > /dev/null || break
            sleep 0.5
          done
          kill -TERM "$WATCHER" 2>/dev/null || true

          # MODIFIED: trim to app launch (+3s margin), downscale, 15 fps, CRF 30
          if [ -f "$APP_START_FILE" ] && [ -f "$RAW" ]; then
            KEEP=$(( STOP - $(cat "$APP_START_FILE") + 3 ))
            ffmpeg -y -loglevel error -sseof "-$KEEP" -i "$RAW" \
              -vf "scale=540:-2,fps=15" -an \
              -c:v libx264 -preset veryfast -crf 30 -pix_fmt yuv420p -movflags +faststart \
              "$VIDEO" || echo "::warning::ffmpeg failed"
            ls -lh "$RAW" "$VIDEO" || true
            echo "[REC] Video saved: $VIDEO"
          else
            echo "::warning::App never launched - no video recorded."
          fi
          exit $PATROL_EXIT

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-ios-video
          path: test_videos/*.mp4
          if-no-files-found: warn