name: Patrol iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  patrol-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.example.basicModernApp
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ADDED: keep CocoaPods so Patrol's RunnerUITests target can link the patrol pod
      - run: flutter config --no-enable-swift-package-manager

      - run: flutter pub get

      - name: Add Patrol RunnerUITests target
        run: |
          gem install xcodeproj --no-document
          ruby ios/add_patrol_ui_tests.rb

      - run: |
          dart pub global activate patrol_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run Patrol test (with recording)
        timeout-minutes: 25   # ADDED: a stuck step can no longer burn the whole job
        run: |
          set -m
          mkdir -p test_videos
          VIDEO="test_videos/patrol_ios_$(date +%Y%m%d_%H%M%S).mp4"

          (
            until xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "UIKitApplication:$BUNDLE_ID"; do
              sleep 0.5
            done
            echo "[REC] App launched - recording started"
            exec xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$VIDEO"
          ) &
          WATCHER=$!

          set +e
          patrol test -t patrol_test/app_test.dart -d "$UDID" --verbose   # MODIFIED: added --verbose
          PATROL_EXIT=$?
          set -e

          # MODIFIED: stop the recorder with SIGINT (finalizes MP4), bounded wait, then end the watcher
          pkill -INT -f "recordVideo" || true
          for i in $(seq 1 20); do
            pgrep -f "recordVideo" > /dev/null || break
            sleep 0.5
          done
          kill -TERM "$WATCHER" 2>/dev/null || true

          if [ -f "$VIDEO" ]; then
            echo "[REC] Video saved: $VIDEO"
          else
            echo "::warning::App never launched - no video recorded."
          fi
          exit $PATROL_EXIT

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-ios-video
          path: test_videos/*.mp4
          if-no-files-found: warn